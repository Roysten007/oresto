<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oresto — Créez le site de votre restaurant en 12 minutes</title>
    <meta name="description" content="Oresto est la plateforme SaaS qui permet aux restaurants de créer leur site professionnel, gérer leurs commandes et communiquer avec leurs clients. Sans code, sans carte bancaire.">
    
    
    <meta name="theme-color" content="#FF6B00" />
    <meta property="og:type" content="website" />

    <!-- DNS prefetch & preconnect for external CDNs -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>

    <!-- Preload LCP hero image -->
    <link rel="preload" href="/screenshots/dashboard-restaurant.jpg" as="image" type="image/jpeg" fetchpriority="high">

    <!-- Non-blocking Google Fonts with font-display: swap -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Outfit:wght@400;500;600;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Outfit:wght@400;500;600;700&display=swap">
    </noscript>

    <!-- Non-blocking FontAwesome icon font -->
    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer">

      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer">
    </noscript>

    <meta property="og:title" content="Oresto — Créez le site de votre restaurant en 12 minutes">
    <meta name="twitter:title" content="Oresto — Créez le site de votre restaurant en 12 minutes">
    <meta property="og:description" content="Oresto est la plateforme SaaS qui permet aux restaurants de créer leur site professionnel, gérer leurs commandes et communiquer avec leurs clients. Sans code, sans carte bancaire.">
    <meta name="twitter:description" content="Oresto est la plateforme SaaS qui permet aux restaurants de créer leur site professionnel, gérer leurs commandes et communiquer avec leurs clients. Sans code, sans carte bancaire.">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="twitter:card" content="summary">

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
